<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsiAnalise - Sistema de Análise Funcional (Dra. Daniele Sousa Santos)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lilas: {
                            50: '#F5F3FF',
                            100: '#EDE9FE',
                            200: '#DDD6FE',
                            300: '#C4B5FD',
                            400: '#A78BFA',
                            500: '#8A70D6',
                            600: '#7C3AED',
                            700: '#6D28D9',
                        },
                        rosaSoft: {
                            50: '#FFF5F7',
                            100: '#F8E8EE',
                            200: '#F3D0DC',
                        },
                        grafite: '#2D3748',
                    }
                }
            }
        }
    </script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            color: #2D3748;
        }
        
        /* Print Styles for Perfect PDF Output */
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-break-inside-avoid {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .page-break-before {
                page-break-before: always;
                break-before: page;
            }
            @page {
                size: A4;
                margin: 15mm 15mm 15mm 15mm;
            }
            .print-container {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
        }

        .print-only {
            display: none;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F1F1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #C4B5FD;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8A70D6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Default Professional Profile Data
        const INITIAL_PROFILE = {
            nome: "Daniele Sousa Santos",
            crp: "22/07398",
            email: "daniele.psicologia@exemplo.com.br",
            telefone: "(98) 98888-7777",
            consultorio: "Clínica de Psicologia & Análise do Comportamento"
        };

        // Initial Sample Patient Data
        const INITIAL_PATIENTS = [
            {
                id: "pat_1",
                nome: "Lucas Mendes (Exemplo)",
                idade: 17,
                categoria: "Adolescente",
                responsavel: "Mariana Mendes (Mãe)",
                contato: "(98) 99123-4567",
                observacoes: "Encaminhado por queixas de esquiva escolar e ansiedade em apresentações.",
                status: "Ativo",
                dataCadastro: "2026-01-15"
            },
            {
                id: "pat_2",
                nome: "Camila Ribeiro (Exemplo)",
                idade: 28,
                categoria: "Adulto",
                responsavel: "",
                contato: "(98) 98765-4321",
                observacoes: "Queixa de procrastinação no ambiente corporativo e sobrecarga emocional.",
                status: "Ativo",
                dataCadastro: "2026-02-01"
            }
        ];

        // Initial Sample Analyses
        const INITIAL_ANALYSES = [
            {
                id: "ana_1",
                pacienteId: "pat_1",
                pacienteNome: "Lucas Mendes (Exemplo)",
                tipo: "Molecular",
                tema: "Esquiva de apresentações orais na escola",
                comportamentoAlvo: "Desligar a câmera e inventar mal-estar ao ser chamado pelo professor",
                status: "Concluída",
                dataAtualizacao: "2026-03-10",
                contingencia: {
                    antecedentes: "Professor solicita abertura de câmera e apresentação de seminário individual online.",
                    respostas: "Aumento da frequência cardíaca, sudorese, pensamento 'vou passar vergonha', fechamento do navegador e mensagem de texto dizendo que passou mal.",
                    consequencias: "Alívio imediato da ansiedade (reforço negativo), adiamento da apresentação, notificação enviada aos pais.",
                    efeitosEmocionais: "Sentimento temporário de alívio seguido de culpa e desesperança no final do dia.",
                    efeitoProbabilidade: "Aumento da probabilidade de emitir respostas de esquiva em situações de cobrança pública futuras.",
                    processoHipotetizado: "Reforçamento Negativo (Esquiva/Fuga de estimulação aversiva social)",
                    confiancaClinica: "Alto"
                },
                anotacoesPrivadas: "Investigar história de punição pública na 7ª série. Trabalhar dessensibilização sistemática e treino de assertividade."
            }
        ];

        function App() {
            // Persistent State
            const [profile, setProfile] = useState(() => {
                const saved = localStorage.getItem('psi_profile');
                return saved ? JSON.parse(saved) : INITIAL_PROFILE;
            });

            const [patients, setPatients] = useState(() => {
                const saved = localStorage.getItem('psi_patients');
                return saved ? JSON.parse(saved) : INITIAL_PATIENTS;
            });

            const [analyses, setAnalyses] = useState(() => {
                const saved = localStorage.getItem('psi_analyses');
                return saved ? JSON.parse(saved) : INITIAL_ANALYSES;
            });

            const [molarAnalyses, setMolarAnalyses] = useState(() => {
                const saved = localStorage.getItem('psi_molar_analyses');
                return saved ? JSON.parse(saved) : [];
            });

            const [interventions, setInterventions] = useState(() => {
                const saved = localStorage.getItem('psi_interventions');
                return saved ? JSON.parse(saved) : [];
            });

            // UI Control States
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSharedMode, setIsSharedMode] = useState(false); // Toggle: Patient Shared vs Clinical Mode
            const [searchQuery, setSearchQuery] = useState('');
            const [autoSaveStatus, setAutoSaveStatus] = useState('Salvo');
            const [selectedPatientId, setSelectedPatientId] = useState('');

            // Modals
            const [isPatientModalOpen, setIsPatientModalOpen] = useState(false);
            const [editingPatient, setEditingPatient] = useState(null);

            // Active Form State for Molecular Analysis Wizard
            const [currentMolecularStep, setCurrentMolecularStep] = useState(1);
            const [activeMolecular, setActiveMolecular] = useState({
                id: '',
                pacienteId: '',
                tema: '',
                comportamentoAlvo: '',
                contexto: '',
                objetivo: '',
                status: 'Rascunho',
                contingencia: {
                    antecedentes: '',
                    respostas: '',
                    consequencias: '',
                    efeitosEmocionais: '',
                    efeitoProbabilidade: 'Aumentou',
                    processoHipotetizado: 'Reforçamento Negativo',
                    confiancaClinica: 'Médio'
                },
                anotacoesPrivadas: ''
            });

            // Active Form State for Molar Analysis
            const [activeMolar, setActiveMolar] = useState({
                id: '',
                pacienteId: '',
                historiaAprendizagem: '',
                padroesRecorrentes: '',
                consequenciasCumulativas: '',
                relacoesMolares: '',
                análisesVinculadas: [],
                status: 'Rascunho'
            });

            // Active PDF Print Options
            const [pdfConfig, setPdfConfig] = useState({
                incluirDiagrama: true,
                incluirEfeitos: true,
                incluirProcessos: true,
                incluirAnotacoesPrivadas: false,
                incluirMolar: true,
                incluirIntervencoes: true
            });

            // Save state updates to LocalStorage
            useEffect(() => {
                localStorage.setItem('psi_profile', JSON.stringify(profile));
            }, [profile]);

            useEffect(() => {
                localStorage.setItem('psi_patients', JSON.stringify(patients));
            }, [patients]);

            useEffect(() => {
                localStorage.setItem('psi_analyses', JSON.stringify(analyses));
            }, [analyses]);

            useEffect(() => {
                localStorage.setItem('psi_molar_analyses', JSON.stringify(molarAnalyses));
            }, [molarAnalyses]);

            useEffect(() => {
                localStorage.setItem('psi_interventions', JSON.stringify(interventions));
            }, [interventions]);

            // Auto-save feedback simulation
            const triggerAutoSave = () => {
                setAutoSaveStatus('Salvando...');
                setTimeout(() => {
                    const now = new Date();
                    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    setAutoSaveStatus(`Salvo às ${timeStr}`);
                }, 400);
            };

            // BeforeUnload Warning for Unsaved Changes
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (activeMolecular.tema || activeMolecular.comportamentoAlvo) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [activeMolecular]);

            // Icons rendering setup
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Handlers for Patient Management
            const handleSavePatient = (patientData) => {
                if (patientData.id) {
                    setPatients(patients.map(p => p.id === patientData.id ? patientData : p));
                } else {
                    const newPatient = {
                        ...patientData,
                        id: `pat_${Date.now()}`,
                        dataCadastro: new Date().toISOString().split('T')[0],
                        status: 'Ativo'
                    };
                    setPatients([...patients, newPatient]);
                }
                setIsPatientModalOpen(false);
                setEditingPatient(null);
                triggerAutoSave();
            };

            const handleArchivePatient = (id) => {
                setPatients(patients.map(p => p.id === id ? { ...p, status: p.status === 'Ativo' ? 'Arquivado' : 'Ativo' } : p));
                triggerAutoSave();
            };

            // Handlers for Molecular Analysis
            const handleSaveMolecular = (statusOverride) => {
                if (!activeMolecular.pacienteId) {
                    alert("Por favor, selecione um paciente para a análise.");
                    return;
                }
                const paciente = patients.find(p => p.id === activeMolecular.pacienteId);
                const updatedStatus = statusOverride || activeMolecular.status;
                const analysisToSave = {
                    ...activeMolecular,
                    pacienteNome: paciente ? paciente.nome : 'Não Identificado',
                    status: updatedStatus,
                    dataAtualizacao: new Date().toISOString().split('T')[0]
                };

                if (activeMolecular.id) {
                    setAnalyses(analyses.map(a => a.id === activeMolecular.id ? analysisToSave : a));
                } else {
                    const newId = `ana_${Date.now()}`;
                    analysisToSave.id = newId;
                    setAnalyses([analysisToSave, ...analyses]);
                    setActiveMolecular(analysisToSave);
                }
                triggerAutoSave();
            };

            const handleStartNewMolecular = (patientId = '') => {
                setActiveMolecular({
                    id: '',
                    pacienteId: patientId,
                    tema: '',
                    comportamentoAlvo: '',
                    contexto: '',
                    objetivo: '',
                    status: 'Rascunho',
                    contingencia: {
                        antecedentes: '',
                        respostas: '',
                        consequencias: '',
                        efeitosEmocionais: '',
                        efeitoProbabilidade: 'Aumentou',
                        processoHipotetizado: 'Reforçamento Negativo',
                        confiancaClinica: 'Médio'
                    },
                    anotacoesPrivadas: ''
                });
                setCurrentMolecularStep(1);
                setActiveTab('molecular');
            };

            const handleLoadMolecularForEdit = (ana) => {
                setActiveMolecular(ana);
                setCurrentMolecularStep(1);
                setActiveTab('molecular');
            };

            // Print Handler
            const handlePrintPDF = () => {
                window.print();
            };

            // Stats for Dashboard
            const stats = useMemo(() => {
                const totalPatients = patients.filter(p => p.status === 'Ativo').length;
                const completedAnalyses = analyses.filter(a => a.status === 'Concluída').length;
                const draftAnalyses = analyses.filter(a => a.status === 'Rascunho' || a.status === 'Em Construção').length;
                return { totalPatients, completedAnalyses, draftAnalyses };
            }, [patients, analyses]);

            // Filtered lists
            const filteredPatients = useMemo(() => {
                return patients.filter(p => p.nome.toLowerCase().includes(searchQuery.toLowerCase()) || p.observacoes.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [patients, searchQuery]);

            const filteredAnalyses = useMemo(() => {
                return analyses.filter(a => a.pacienteNome.toLowerCase().includes(searchQuery.toLowerCase()) || a.tema.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [analyses, searchQuery]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#F8F9FA] text-grafite">
                    
                    {/* SIDEBAR - Navigation & Controls (Hidden during print) */}
                    <aside className="w-full md:w-64 bg-white border-r border-gray-200 flex-shrink-0 no-print flex flex-col justify-between">
                        <div>
                            {/* App Header & Therapist Identity */}
                            <div className="p-5 border-b border-gray-100 bg-lilas-50">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-lilas-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                                        Ψ
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-gray-900 text-base leading-tight">PsiAnálise</h1>
                                        <p className="text-xs text-lilas-700 font-medium">Análise Funcional</p>
                                    </div>
                                </div>
                                
                                {/* Dra. Daniele Sousa Santos CRP Display */}
                                <div className="mt-4 pt-3 border-t border-lilas-200/60 text-xs">
                                    <p className="font-semibold text-gray-800">{profile.nome}</p>
                                    <p className="text-gray-500 font-mono">CRP: {profile.crp}</p>
                                </div>
                            </div>

                            {/* Navigation Links */}
                            <nav className="p-3 space-y-1 text-sm font-medium">
                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>Dashboard</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('pacientes')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'pacientes' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="users" className="w-4 h-4"></i>
                                    <span>Pacientes</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('molecular')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'molecular' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="git-commit" className="w-4 h-4"></i>
                                    <span>Análise Molecular</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('molar')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'molar' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="layers" className="w-4 h-4"></i>
                                    <span>Análise Molar</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('intervencao')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'intervencao' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="target" className="w-4 h-4"></i>
                                    <span>Plano de Intervenção</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('exportar')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'exportar' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="file-text" className="w-4 h-4"></i>
                                    <span>Gerar PDF / Relatório</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('config')} 
                                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-colors ${activeTab === 'config' ? 'bg-lilas-100 text-lilas-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <i data-lucide="settings" className="w-4 h-4"></i>
                                    <span>Perfil Profissional</span>
                                </button>
                            </nav>
                        </div>

                        {/* Session Mode Switch & Status */}
                        <div className="p-4 border-t border-gray-200 bg-gray-50/50">
                            <div className="bg-white p-3 rounded-xl border border-gray-200 shadow-sm space-y-3">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-semibold text-gray-700">Modo Compartilhado</span>
                                    <button 
                                        onClick={() => setIsSharedMode(!isSharedMode)}
                                        className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${isSharedMode ? 'bg-lilas-500' : 'bg-gray-300'}`}
                                    >
                                        <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isSharedMode ? 'translate-x-5' : 'translate-x-0'}`} />
                                    </button>
                                </div>
                                <p className="text-[11px] text-gray-500 leading-tight">
                                    {isSharedMode 
                                        ? "👀 Ocultando anotações clínicas privadas para compartilhamento de tela na sessão."
                                        : "🔒 Exibindo todos os campos e notas técnicas privadas."
                                    }
                                </p>
                            </div>

                            <div className="mt-3 flex items-center justify-between text-xs text-gray-500 px-1">
                                <span className="flex items-center space-x-1.5">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    <span>{autoSaveStatus}</span>
                                </span>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        
                        {/* Shared Session Alert Bar */}
                        {isSharedMode && (
                            <div className="no-print mb-6 bg-rosaSoft-100 border border-rosaSoft-200 rounded-xl p-3 flex items-center justify-between text-sm text-gray-800 shadow-sm">
                                <div className="flex items-center space-x-2">
                                    <i data-lucide="eye" className="w-5 h-5 text-lilas-600"></i>
                                    <span className="font-medium">Modo de Co-construção Ativo (Paciente)</span>
                                    <span className="text-xs bg-white px-2 py-0.5 rounded border border-rosaSoft-200 text-gray-600">Anotações técnicas ocultadas</span>
                                </div>
                                <button onClick={() => setIsSharedMode(false)} className="text-xs font-semibold text-lilas-700 hover:underline">
                                    Alternar para Modo Clínico
                                </button>
                            </div>
                        )}

                        {/* TAB 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-900">Visão Geral Clínica</h2>
                                        <p className="text-sm text-gray-500">Acompanhamento de análises funcionais e prontuários.</p>
                                    </div>
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={() => handleStartNewMolecular('')}
                                            className="px-4 py-2 bg-lilas-500 hover:bg-lilas-600 text-white rounded-lg text-sm font-medium shadow-sm transition-colors flex items-center space-x-2"
                                        >
                                            <i data-lucide="plus" className="w-4 h-4"></i>
                                            <span>Nova Análise</span>
                                        </button>
                                        <button 
                                            onClick={() => { setEditingPatient(null); setIsPatientModalOpen(true); }}
                                            className="px-4 py-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-lg text-sm font-medium shadow-sm transition-colors flex items-center space-x-2"
                                        >
                                            <i data-lucide="user-plus" className="w-4 h-4"></i>
                                            <span>Novo Paciente</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Stats Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-lilas-50 text-lilas-600 rounded-xl">
                                            <i data-lucide="users" className="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs font-medium text-gray-500">Pacientes Ativos</p>
                                            <p className="text-2xl font-bold text-gray-900">{stats.totalPatients}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-green-50 text-green-600 rounded-xl">
                                            <i data-lucide="check-circle-2" className="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs font-medium text-gray-500">Análises Concluídas</p>
                                            <p className="text-2xl font-bold text-gray-900">{stats.completedAnalyses}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-amber-50 text-amber-600 rounded-xl">
                                            <i data-lucide="clock" className="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs font-medium text-gray-500">Rascunhos / Em Andamento</p>
                                            <p className="text-2xl font-bold text-gray-900">{stats.draftAnalyses}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Recent Analyses Table */}
                                <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                                    <div className="p-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <h3 className="font-bold text-gray-900 text-lg">Análises Funcionais Recentes</h3>
                                        <div className="relative w-full sm:w-64">
                                            <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Buscar por paciente ou tema..." 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}

                                                <p className="text-xs text-gray-500">Visualização sequencial da contingência funcional.</p>
